[package]
name = "dbased"
version = "0.1.0"
edition = "2024"
description = "Clean Libadwaita GUI Database Client for MySQL and PostgreSQL"
license = "MIT"

[dependencies]
gtk4 = { version = "0.9", package = "gtk4", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
sourceview5 = { version = "0.9", features = ["v5_10"] }
tokio = { version = "1", features = ["full"] }
async-channel = "2"
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
oo7 = { version = "0.4", default-features = false, features = ["tokio", "native_crypto"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "postgres", "chrono", "uuid", "rust_decimal"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
russh = "0.49"
russh-keys = "0.49"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[package.metadata.deb]
maintainer = "toby <https://github.com/tsndr/dbased>"
copyright = "2026, toby"
license-file = ["README.md", "0"]
depends = "$auto, hicolor-icon-theme"
section = "database"
priority = "optional"
assets = [
    ["target/release/dbased", "usr/bin/", "755"],
    ["data/dev.tsndr.dbased.desktop", "usr/share/applications/", "644"],
    ["data/dev.tsndr.dbased.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/dev.tsndr.dbased.metainfo.xml", "usr/share/metainfo/", "644"],
]
